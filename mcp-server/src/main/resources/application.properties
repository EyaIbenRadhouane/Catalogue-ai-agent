spring.application.name=mcp-server
spring.datasource.url=jdbc:mariadb://localhost:3306/cataloguedb?createDatabaseIfNotExist=true
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=
# JPA : creer/mettre a jour les tables automatiquement
spring.jpa.hibernate.ddl-auto=update
# MariaDB 10.4 necessite le dialecte legacy avec Hibernate 7.4.
spring.jpa.database-platform=org.hibernate.community.dialect.MariaDBLegacyDialect
spring.jpa.show-sql=true
server.port=9090
spring.ai.mcp.server.protocol=streamable
spring.ai.mcp.client.streamable-http.connections.mcpproduct.url=http://localhost:9090